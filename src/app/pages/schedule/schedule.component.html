<div>

    <h2>League Schehdule</h2>

    <table>
        <thead>
            <tr>
                <th>Date/Time</th>
                <th>Stadium</th>
                <th>Home Team</th>
                <th>Result</th>
                <th>Away Team</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let match of matches">
                <td>{{ match.matchDate }}</td>
                <td>{{ match.stadium }}</td>
                <td>{{ match.homeTeam }}</td>
                <td>
                    {{ match.matchPlayed ? match.homeTeamScore + ' : ' + match.awayTeamScore : '- : -' }}
                </td>
                <td>{{ match.awayTeam }}</td>
            </tr>
        </tbody>
    </table>


</div>
